<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-label="Madi Popescu">
  <title>Madi Popescu</title>
  <!-- twee kleurenbanden: Roemeense (blauw-geel-rood) en Nederlandse (rood-wit-blauw) tint -->
  <g transform="translate(8 14)">
    <rect width="20" height="30" fill="#002b7f"/><rect x="20" width="20" height="30" fill="#fcd116"/><rect x="40" width="20" height="30" fill="#ce1126"/>
    <rect y="34" width="60" height="10" fill="#ae1c28"/><rect y="44" width="60" height="10" fill="#fff" stroke="#ccd3de"/><rect y="54" width="60" height="10" fill="#21468b"/>
  </g>
  <text x="90" y="50" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#1d2433">Madi Popescu</text>
  <text x="92" y="74" font-family="system-ui,sans-serif" font-size="14" letter-spacing="1.5" fill="#5b6475">ROEMEENS · NEDERLANDS</text>
</svg>
